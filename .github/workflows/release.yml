name: Release

# Permanent GitHub Release with NVRAFX Windows package.
# Trigger: push tag v* OR workflow_dispatch with version input.
# Secrets: uses GITHUB_TOKEN only (no extra secrets required for unsigned release).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"
      draft:
        description: "Create as draft release"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path constraints.txt) {
            pip install -r requirements.txt -c constraints.txt
          } else {
            pip install -r requirements.txt
          }

      - name: pip check
        shell: pwsh
        run: python -m pip check

      - name: Build NVRAFX.exe
        shell: pwsh
        run: |
          python -m PyInstaller packaging/nvrafx_onefile.spec --noconfirm --clean
          if (-not (Test-Path dist/NVRAFX.exe)) { throw "NVRAFX.exe missing" }
          if (Test-Path dist/NUNG.exe) { throw "NUNG.exe must not be produced" }
          if (Test-Path dist/NVRA.exe) { throw "NVRA.exe must not be produced" }

      - name: Smoke CLI
        shell: pwsh
        run: |
          function Invoke-NvrafxCli([string]$CliArg) {
            $p = Start-Process -FilePath ".\dist\NVRAFX.exe" -ArgumentList $CliArg -Wait -PassThru -WindowStyle Hidden
            Write-Host "NVRAFX $CliArg ExitCode=$($p.ExitCode)"
            if ($null -eq $p.ExitCode -or $p.ExitCode -ne 0) {
              throw "NVRAFX $CliArg failed ExitCode=$($p.ExitCode)"
            }
          }
          Invoke-NvrafxCli "--version"
          Invoke-NvrafxCli "--health"

      - name: Package release ZIP
        shell: pwsh
        run: |
          $h = Get-FileHash dist/NVRAFX.exe -Algorithm SHA256
          "NVRAFX.exe  $($h.Hash)" | Set-Content -Encoding utf8 SHA256SUMS.txt
          @"
          # NVRAFX Release
          Product: NVRAFX
          LIVE-AUTHORIZED: false
          SHA256: $($h.Hash)
          Size: $((Get-Item dist/NVRAFX.exe).Length)
          Docs: LIVE_VALIDATION.md (if present), PHASE7 residual notes
          Warning: LIVE can produce real transactions; default is fail-closed.
          "@ | Set-Content -Encoding utf8 RELEASE_NOTES.md
          $files = @("dist/NVRAFX.exe", "SHA256SUMS.txt", "RELEASE_NOTES.md")
          if (Test-Path LIVE_VALIDATION.md) { $files += "LIVE_VALIDATION.md" }
          Compress-Archive -Path $files -DestinationPath NVRAFX_WINDOWS_RELEASE.zip -Force
          Write-Host "SHA256=$($h.Hash)"

      - name: Resolve tag name
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          DRAFT_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.draft }}" = "true" ]; then
            DRAFT_FLAG="--draft"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -f "$TAG" || true
            git push origin "$TAG" || true
          fi
          gh release create "$TAG" \
            NVRAFX_WINDOWS_RELEASE.zip \
            SHA256SUMS.txt \
            --title "NVRAFX $TAG" \
            --generate-notes \
            $DRAFT_FLAG \
            --verify-tag || \
          gh release upload "$TAG" NVRAFX_WINDOWS_RELEASE.zip SHA256SUMS.txt --clobber
