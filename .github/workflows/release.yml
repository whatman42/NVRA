name: Release

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Windows Build", "Regression"]
    types: [completed]

permissions:
  contents: read

jobs:
  release-label:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Label release capability
        run: |
          cat > RELEASE_LABEL.md << 'EOT'
          # NVRAFX Release Label
          Product: NVRAFX
          Binary: NVRAFX.exe (single product executable)
          Architecture: N.U.N.G. / GOD (internal modules)
          PAPER: yes
          DEMO: capable (requires real broker verification on Windows)
          LIVE-CAPABLE: infrastructure only
          LIVE-AUTHORIZED: false
          Note: NUNG.exe and NVRA.exe are not distributed.
          EOT
          echo "LIVE-AUTHORIZED remains false until explicit human gate"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nvrafx-release-label
          path: RELEASE_LABEL.md
