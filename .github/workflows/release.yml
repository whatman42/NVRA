name: Release

# Permanent GitHub Release with NVRA Windows package.
# Trigger: push tag v* OR workflow_dispatch with version input.
# Secrets: uses GITHUB_TOKEN only (no extra secrets required for public release assets).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-package:
    name: Build Windows package
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path constraints.txt) {
            pip install -r requirements.txt -c constraints.txt
          } else {
            pip install -r requirements.txt
          }
      - run: python -m pip check
      - name: Build NVRA.exe
        shell: pwsh
        run: |
          python -m PyInstaller packaging/nvrafx_onefile.spec --noconfirm --clean
          if (-not (Test-Path dist/NVRA.exe)) { throw "NVRA.exe missing" }
          if (Test-Path dist/NUNG.exe) { throw "NUNG.exe must not be produced" }
          if (Test-Path dist/NVRAFX.exe) { throw "NVRAFX.exe must not be produced as product binary" }
      - name: Smoke CLI
        shell: pwsh
        run: |
          foreach ($CliArg in @("--version", "--health")) {
            $p = Start-Process -FilePath ".\dist\NVRA.exe" -ArgumentList $CliArg -Wait -PassThru -WindowStyle Hidden
            Write-Host "NVRA $CliArg ExitCode=$($p.ExitCode)"
            if ($null -eq $p.ExitCode -or $p.ExitCode -ne 0) {
              throw "NVRA $CliArg failed ExitCode=$($p.ExitCode)"
            }
          }
      - name: Package release assets
        shell: pwsh
        run: |
          $h = Get-FileHash dist/NVRA.exe -Algorithm SHA256
          "NVRA.exe  $($h.Hash)" | Set-Content -Encoding utf8 SHA256SUMS.txt
          @"
          # NVRA Release
          Product: NVRA
          Canonical binary: NVRA.exe
          Size: $((Get-Item dist/NVRA.exe).Length)
          SHA256: $($h.Hash)
          "@ | Set-Content -Encoding utf8 RELEASE_NOTES.md
          $files = @("dist/NVRA.exe", "SHA256SUMS.txt", "RELEASE_NOTES.md")
          Compress-Archive -Path $files -DestinationPath NVRA_WINDOWS_RELEASE.zip -Force
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NVRA-Windows-Release
          path: |
            NVRA_WINDOWS_RELEASE.zip
            SHA256SUMS.txt
            RELEASE_NOTES.md

  github-release:
    name: Publish GitHub Release
    needs: windows-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@v4
        with:
          name: NVRA-Windows-Release
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          gh release create "$TAG" \
            NVRA_WINDOWS_RELEASE.zip \
            SHA256SUMS.txt \
            --title "NVRA $TAG" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag || true
          gh release upload "$TAG" NVRA_WINDOWS_RELEASE.zip SHA256SUMS.txt --clobber
