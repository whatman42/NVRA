name: NVRA CI and Windows Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m pytest -q

  windows-build:
    name: Windows PyInstaller
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pyinstaller --clean --noconfirm build/nvra.spec
      - name: SHA-256
        shell: pwsh
        run: |
          Get-FileHash dist/NVRA.exe -Algorithm SHA256 | Format-List
          Get-FileHash dist/NVRA.exe -Algorithm SHA256 | ConvertTo-Json | Out-File dist/NVRA.exe.sha256.json
      - uses: actions/upload-artifact@v4
        with:
          name: NVRA-Windows
          path: |
            dist/NVRA.exe
            dist/NVRA.exe.sha256.json
