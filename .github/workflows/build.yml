name: NVRA CI and Windows Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Qt/EGL system libs for PySide6 (optional runtime tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libdbus-1-3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: |
          if [ -f constraints.txt ]; then
            pip install -r requirements.txt -c constraints.txt
          else
            pip install -r requirements.txt
          fi
      - run: python -m pip check
      - run: python -m compileall -q .
      - run: python -m pytest -q

  windows-build:
    name: Windows PyInstaller (NVRA)
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - shell: pwsh
        run: |
          if (Test-Path constraints.txt) {
            pip install -r requirements.txt -c constraints.txt
          } else {
            pip install -r requirements.txt
          }
      - run: python -m pip check
      - name: Build NVRA.exe
        shell: pwsh
        run: |
          python -m PyInstaller packaging/nvra_onefile.spec --noconfirm --clean
          if (-not (Test-Path dist/NVRA.exe)) { throw "NVRA.exe missing" }
          if (Test-Path dist/NUNG.exe) { throw "NUNG.exe must not be produced" }
          if (Test-Path dist/NVRAFX.exe) { throw "NVRAFX.exe must not be produced as product binary" }
          $len = (Get-Item dist/NVRA.exe).Length
          if ($len -lt 1000000) { throw "NVRA.exe unexpectedly small: $len" }
          Write-Host "NVRA.exe size=$len"

      - name: CLI smoke (NVRA.exe)
        shell: pwsh
        run: |
          if (-not (Test-Path dist/NVRA.exe)) { throw "NVRA.exe missing before smoke" }
          function Invoke-NvraCli([string]$CliArg) {
            $p = Start-Process `
              -FilePath ".\\dist\\NVRA.exe" `
              -ArgumentList $CliArg `
              -Wait `
              -PassThru `
              -WindowStyle Hidden
            Write-Host "NVRA $CliArg ExitCode=$($p.ExitCode)"
            if ($null -eq $p.ExitCode) {
              throw "NVRA $CliArg returned null ExitCode"
            }
            if ($p.ExitCode -ne 0) {
              throw "NVRA $CliArg failed ExitCode=$($p.ExitCode)"
            }
          }
          Invoke-NvraCli "--version"
          Invoke-NvraCli "--health"

      - name: Actual NVRA.exe headless composition (PAPER)
        shell: pwsh
        run: |
          $results = @()
          for ($i = 0; $i -lt 20; $i++) {
            $p = Start-Process -FilePath ".\\dist\\NVRA.exe" -ArgumentList "--headless" -Wait -PassThru -WindowStyle Hidden
            Write-Host "NVRA --headless run=$i ExitCode=$($p.ExitCode)"
            if ($null -eq $p.ExitCode -or $p.ExitCode -ne 0) { throw "NVRA --headless failed run=$i exit=$($p.ExitCode)" }
            $results += $p.ExitCode
          }
          if (($results | Select-Object -Unique).Count -ne 1) { throw "non-deterministic headless exits" }
          Write-Host "HEADLESS_COMPOSITION_PASS runs=20 exit=0 live=false"

      - name: Actual NVRA.exe process kill/restart recovery
        shell: pwsh
        run: |
          for ($i = 0; $i -lt 5; $i++) {
            $p = Start-Process -FilePath ".\\dist\\NVRA.exe" -ArgumentList "--headless" -PassThru -WindowStyle Hidden
            Start-Sleep -Milliseconds 200
            if (-not $p.HasExited) {
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              try { $p.WaitForExit(5000) } catch {}
            }
            $p2 = Start-Process -FilePath ".\\dist\\NVRA.exe" -ArgumentList "--headless" -Wait -PassThru -WindowStyle Hidden
            if ($null -eq $p2.ExitCode -or $p2.ExitCode -ne 0) { throw "restart failed run=$i exit=$($p2.ExitCode)" }
          }
          Write-Host "PROCESS_RECOVERY_PASS runs=5 live=false"

      - name: Prove MetaTrader5 embedded in NVRA.exe runtime
        shell: pwsh
        run: |
          python -c "import MetaTrader5; print('HOST_MT5_IMPORT_OK')"
          $toc = Get-ChildItem -Recurse build -Filter "*.toc" -ErrorAction SilentlyContinue | Select-Object -First 40
          foreach ($f in $toc) {
            if (Select-String -Path $f.FullName -Pattern "MetaTrader5" -Quiet) { Write-Host "TOC_HIT $($f.FullName)" }
          }
          $p = Start-Process -FilePath ".\\dist\\NVRA.exe" -ArgumentList "--diagnose-mt5" -Wait -PassThru -WindowStyle Hidden -RedirectStandardOutput "mt5_diag_out.txt" -RedirectStandardError "mt5_diag_err.txt"
          Write-Host "NVRA --diagnose-mt5 ExitCode=$($p.ExitCode)"
          if (Test-Path mt5_diag_out.txt) { Get-Content mt5_diag_out.txt | Write-Host }
          if (Test-Path mt5_diag_err.txt) { Get-Content mt5_diag_err.txt | Write-Host }
          $out = ""
          if (Test-Path mt5_diag_out.txt) { $out = Get-Content mt5_diag_out.txt -Raw }
          if ($p.ExitCode -ne 0) { throw "diagnose-mt5 failed exit=$($p.ExitCode)" }
          if ($out -notmatch "python_module") { throw "diagnose-mt5 missing python_module field" }
          if ($out -notmatch '"python_module":\s*"available"') {
            throw "MetaTrader5 NOT available inside NVRA.exe runtime — packaging failed"
          }
          if ($out -match '"live_authorized":\s*true') { throw "LIVE must not be authorized by diagnose" }
          Write-Host "MT5_PACKAGING_PROOF_PASS python_module=available live_authorized=false"

      - name: SHA-256
        shell: pwsh
        run: |
          Get-FileHash dist/NVRA.exe -Algorithm SHA256 | Format-List
          Get-FileHash dist/NVRA.exe -Algorithm SHA256 | ConvertTo-Json | Out-File dist/NVRA.exe.sha256.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NVRA-Windows
          path: |
            dist/NVRA.exe
            dist/NVRA.exe.sha256.json
