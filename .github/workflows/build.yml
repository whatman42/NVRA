name: NVRA CI and Windows Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m compileall -q .
      - run: python -m pytest -q

  windows-build:
    name: Windows PyInstaller (NVRAFX)
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pip check
      - name: Build NVRAFX.exe
        shell: pwsh
        run: |
          python -m PyInstaller packaging/nvrafx_onefile.spec --noconfirm --clean
          if (-not (Test-Path dist/NVRAFX.exe)) { throw "NVRAFX.exe missing" }
          if (Test-Path dist/NUNG.exe) { throw "NUNG.exe must not be produced" }
          if (Test-Path dist/NVRA.exe) { throw "NVRA.exe must not be produced" }
          $len = (Get-Item dist/NVRAFX.exe).Length
          if ($len -lt 1000000) { throw "NVRAFX.exe unexpectedly small: $len" }
          Write-Host "NVRAFX.exe size=$len"
      - name: SHA-256
        shell: pwsh
        run: |
          Get-FileHash dist/NVRAFX.exe -Algorithm SHA256 | Format-List
          Get-FileHash dist/NVRAFX.exe -Algorithm SHA256 | ConvertTo-Json | Out-File dist/NVRAFX.exe.sha256.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NVRAFX-Windows
          path: |
            dist/NVRAFX.exe
            dist/NVRAFX.exe.sha256.json
