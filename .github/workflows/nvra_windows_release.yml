name: NVRAFX Windows Release

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Windows Build"]
    types: [completed]

permissions:
  contents: read

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: pip check
        shell: pwsh
        run: python -m pip check
      - name: Build NVRAFX.exe
        shell: pwsh
        run: |
          python -m PyInstaller packaging/nvrafx_onefile.spec --noconfirm --clean
          if (-not (Test-Path dist/NVRAFX.exe)) { throw "NVRAFX.exe missing" }
          if (Test-Path dist/NUNG.exe) { throw "NUNG.exe must not be produced" }
          if (Test-Path dist/NVRA.exe) { throw "NVRA.exe must not be produced" }
      - name: Smoke test
        shell: pwsh
        run: |
          & .\dist\NVRAFX.exe --version
          if ($LASTEXITCODE -ne 0) { throw "version failed" }
          & .\dist\NVRAFX.exe --health
          if ($LASTEXITCODE -ne 0) { throw "health failed" }
