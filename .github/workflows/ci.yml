name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: pip check
        run: python -m pip check

      - name: Run tests
        run: |
          python -m pytest tests/ -q --tb=short

      - name: Assert Phase 1+2+3+3B-A+3B-B+3B-C+4A+4B baseline count
        run: |
          OUT=$(python -m pytest tests/ -q --tb=no 2>&1) || true
          echo "$OUT"
          echo "$OUT" | grep -E "^[0-9]+ passed" || {
            echo "ERROR: expected pytest summary with N passed"
            exit 1
          }
          PASSED=$(echo "$OUT" | grep -oE "[0-9]+ passed" | head -1 | grep -oE "[0-9]+")
          echo "Passed count: $PASSED"
          if [ "$PASSED" -lt 178 ]; then
            echo "ERROR: Phase 4B baseline requires at least 178 passed (got $PASSED)"
            exit 1
          fi
          echo "OK: Phase baseline met ($PASSED passed)"
