name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f constraints.txt ]; then
            python -m pip install -r requirements.txt -c constraints.txt
          else
            python -m pip install -r requirements.txt
          fi

      - name: pip check
        run: python -m pip check

      - name: Run tests
        run: |
          python -m pytest tests/ -q --tb=short

      - name: Assert Phase baseline count
        run: |
          OUT=$(python -m pytest tests/ -q --tb=no 2>&1) || true
          echo "$OUT"
          echo "$OUT" | grep -E "^[0-9]+ passed" || {
            echo "ERROR: expected pytest summary with N passed"
            exit 1
          }
          PASSED=$(echo "$OUT" | grep -oE "[0-9]+ passed" | head -1 | grep -oE "[0-9]+")
          echo "Passed count: $PASSED"
          if [ "$PASSED" -lt 178 ]; then
            echo "ERROR: Phase baseline requires at least 178 passed (got $PASSED)"
            exit 1
          fi
          echo "OK: Phase baseline met ($PASSED passed)"
