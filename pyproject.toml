[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nvra-unified"
version = "1.0.0"
description = "NVRA Unified institutional-grade paper trading platform"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-ra"
